<h2>User Management</h2>

<!-- 🔍 Search -->
<form method="GET" action="/">
    <input type="text" name="search" placeholder="Search..."
           value="{{ search_query }}">
    
    <!-- 🔽 Sort -->
    <select name="sort">
        <option value="asc" {% if sort_order == 'asc' %}selected{% endif %}>
            A-Z
        </option>
        <option value="desc" {% if sort_order == 'desc' %}selected{% endif %}>
            Z-A
        </option>
    </select>

    <button type="submit">Apply</button>
</form>

<hr>

<!-- 📄 User List -->
<ul>
    {% for user in users.items %}
        <li>
            {{ user.name }} - {{ user.email }}
        </li>
    {% endfor %}
</ul>

<!-- 📄 Pagination Controls -->
<div>
    {% if users.has_prev %}
        <a href="?page={{ users.prev_num }}&search={{ search_query }}&sort={{ sort_order }}">
            Prev
        </a>
    {% endif %}

    Page {{ users.page }} of {{ users.pages }}

    {% if users.has_next %}
        <a href="?page={{ users.next_num }}&search={{ search_query }}&sort={{ sort_order }}">
            Next
        </a>
    {% endif %}
</div>
